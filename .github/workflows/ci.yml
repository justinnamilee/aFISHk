name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Source ref to check
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install integration test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg shellcheck curl unzip nsis gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 mingw-w64-common pkg-config xz-utils
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - name: Install formatters
        run: make format-tools
      - name: Format, vet and race tests
        run: make check
      - name: Shell checks
        run: shellcheck scripts/*.sh scripts/linux/*.sh tests/*.sh
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.3
      - name: Build
        run: make build
      - name: Lint Windows backend on Linux
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        with:
          version: v2.11.3
      - name: Compile Windows code and tests on Linux
        run: |
          make windows
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -exec /bin/true ./...
      - name: Verify Linux archives and cross-built Windows installer
        run: make release VERSION=v1.0.0-rc.1
