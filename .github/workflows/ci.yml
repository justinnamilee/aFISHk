name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Source ref to check
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Install integration test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg shellcheck
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
      - name: Format, vet and race tests
        run: make check
      - name: Shell checks
        run: shellcheck scripts/*.sh
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.11.3
      - name: Build
        run: make build
