name: Draft release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semver tag (v1.0.0 or v1.0.0-rc.1)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: draft-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
  package:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Linux cross-packaging tools
        run: sudo apt-get update && sudo apt-get install -y nsis gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 mingw-w64-common pkg-config make curl xz-utils
      - name: Check release tag and package tested source
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          make release VERSION="$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  draft:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Attach binaries and checksums to draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          if gh release view "$TAG" --json isDraft > release.json; then
            test "$(jq -r .isDraft release.json)" = true || { echo 'Refusing to modify a published release'; exit 1; }
          else
            gh release create "$TAG" --verify-tag --draft --title "aFISHk $TAG" --notes "Windows includes FFmpeg (LGPL-2.1-or-later) and Opus (BSD). Matching source and build instructions: afishk_${TAG}_windows_media_sources.tar.gz. See installed license notices." --generate-notes
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/*_setup.exe dist/SHA256SUMS --clobber
