<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0e2026">
  <title>aFISHk · Fishing companion</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>aFISHk</h1>
      <div class="tagline">
        <span class="waterline" aria-hidden="true"></span>
        <span>At the water’s edge.</span>
      </div>
    </header>
    <div class="fish-control">
      <button id="fish" disabled aria-describedby="fish-hint">
        <span class="fish-icon" aria-hidden="true">🎣</span>
        <strong>Fish</strong>
        <small id="fish-hint">Listen for a bite. Tap when you’re ready.</small>
      </button>
      <span id="connection" class="connection" role="status" data-state="connecting" title="Connecting to desktop service…">
        <span class="sr-only">Connecting to desktop service…</span>
      </span>
    </div>
    <section class="tools" aria-label="Companion tools">
      <button id="audio-start" disabled>Listen to desktop</button>
      <button id="audio-stop" disabled>Stop audio</button>
      <button id="capture" disabled>Fresh screenshot</button>
    </section>
    <audio id="audio" aria-label="Desktop audio" autoplay playsinline controls></audio>
    <section class="activity" aria-labelledby="activity-title">
      <h2 id="activity-title">Activity <button id="log-sort" type="button" aria-controls="activity-log" aria-label="Newest first. Sort oldest first" title="Newest first. Sort oldest first"><span aria-hidden="true">▼</span></button></h2>
      <div id="activity-log" role="log" aria-label="Activity log" aria-relevant="additions" tabindex="0"></div>
    </section>
    <section id="capture-panel" hidden>
      <h2>Latest successful capture</h2>
      <a id="full-image" href="/api/screenshot.png" target="_blank" rel="noopener">Open full size to zoom</a>
      <img id="screenshot" alt="Latest successful WoW window capture">
    </section>
    <footer>Manual input · All desktop audio · Keep page in foreground</footer>
  </main>
</body>
</html>
